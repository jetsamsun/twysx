<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>twysx</title>
<meta name="description" content="twysx：极简博客与每日国际新闻">
<link rel="stylesheet" href="/style.css?v=38353fc8">
</head>
<body>
<div class="wrap">
<header class="site"><a class="brand" href="/">twysx<span>.</span></a><form class="search" action="/search/" method="get" role="search"><input type="search" name="q" placeholder="搜索文章和新闻" aria-label="搜索" autocomplete="off" enterkeyhint="search" maxlength="100"></form><nav><a href="/articles/">文章</a><a href="/news/">国际新闻</a></nav></header>
<main>
<section>
<div class="sec"><span>文章<span class="cnt">共 1 篇</span></span><a href="/articles/">全部 →</a></div>
<ul class="list">
<li><time datetime="2026-11-12">2026-11-12</time><a href="/p/hello.html">你好，twysx</a></li>
</ul>
</section>
<section id="news" hidden>
<div class="sec"><span>国际新闻<span class="cnt" id="news-total"></span></span><a href="/news/">全部 →</a></div>
<ul class="list" id="news-list"></ul>
</section>
<noscript><p><a href="/news/">查看国际新闻 →</a></p></noscript>
<script>
(function () {
  var box = document.getElementById('news');
  fetch('/news/latest.json', {cache: 'no-cache'})
    .then(function (r) { if (!r.ok) throw 0; return r.json(); })
    .then(function (data) {
      // 新格式 {total, items}；兼容旧格式（纯数组），新旧文件交替的几秒里也不会出错
      var items = Array.isArray(data) ? data : ((data && data.items) || []);
      var total = Array.isArray(data) ? 0 : Math.floor(Number(data && data.total));
      var ul = document.getElementById('news-list'), n = 0;
      items.forEach(function (it) {
        if (String(it.u).indexOf('/news/') !== 0) return;
        var li = document.createElement('li'), t = document.createElement('time'),
            a = document.createElement('a'), s = document.createElement('small');
        t.textContent = String(it.d);
        a.textContent = it.t; a.href = it.u; a.lang = 'en';
        s.textContent = it.s;
        li.appendChild(t); li.appendChild(a); li.appendChild(s);
        ul.appendChild(li); n++;
      });
      if (total > 0) document.getElementById('news-total').textContent = '共 ' + total + ' 条';
      if (n) box.hidden = false;
    })
    .catch(function () {});
})();
</script>

</main>
<footer class="site">© 2026 twysx</footer>
</div>
</body>
</html>
